<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Makes the website responsive on phones and tablets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <!-- Connect our CSS file. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ======================================================
         HEADER
         ====================================================== -->

    <header>
        <h1>Task Tracker</h1>
        <p>Simple full-stack task management app</p>
    </header>


    <!-- ======================================================
         MAIN CONTENT
         ====================================================== -->

    <main>

        <!-- ==================================================
             ADD TASK SECTION
             ================================================== -->

        <section class="task-form-section">
            <h2>Add a Task</h2>
            <form id="taskForm">
                <label for="taskInput">
                    Task name
                </label>
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task..."
                    required
                >
                <button type="submit">
                    Add Task
                </button>
            </form>
        </section>


        <!-- ==================================================
             TASK LIST SECTION
             ================================================== -->

        <section class="task-list-section">
            <h2>My Tasks</h2>
            <!-- JavaScript will add tasks inside this element. -->
            <ul id="taskList"></ul>
        </section>
    </main>


    <!-- ======================================================
         FOOTER
         ====================================================== -->

    <footer>
        <p>Task Tracker — Beginner Full-Stack Project</p>
    </footer>


    <!--
        Load JavaScript at the end of the body.

        This means the HTML elements already exist when
        JavaScript starts looking for them.
    -->
    <script src="script.js"></script>

</body>

</html>
